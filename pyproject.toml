[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-stt-plugin-browser"
version = "0.1.0a1"
description = "OpenVoiceOS STT plugin: the browser's own speech recognition (Web Speech API)"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "emkay-voice"}]
requires-python = ">=3.10"
keywords = ["ovos", "openvoiceos", "plugin", "stt", "speech-to-text", "browser", "web-speech-api", "pyodide", "emkay"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Environment :: WebAssembly :: Emscripten",
]
dependencies = [
    "ovos-plugin-manager>=0.0.26",
    "ovos-utils>=0.0.38",
    "ovos-config>=0.0.12",
]

[project.urls]
Homepage = "https://github.com/emkay-voice/ovos-stt-plugin-browser"
Issues = "https://github.com/emkay-voice/ovos-stt-plugin-browser/issues"
Emkay = "https://github.com/emkay-voice/emkay"

[project.entry-points."opm.stt"]
ovos-stt-plugin-browser = "ovos_stt_plugin_browser:BrowserSTT"

[tool.setuptools]
packages = ["ovos_stt_plugin_browser"]
